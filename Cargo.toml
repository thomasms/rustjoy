[package]
name = "rustjoy"
version = "0.1.0"
edition = "2021"
description = "Rust ports of NJOY2016 (rustjoy: MODER, RECONR, BROADR, HEATR, THERMR, UNRESR, GASPR, PURR, LEAPR, MIXR, RESXSR, DTFR, GAMINR and GROUPR modules) and of the PREPRO 2026 codes (prustpro)"
license = "MIT AND BSD-3-Clause"

[lib]
name = "rustjoy"
path = "src/rustjoy/lib.rs"

[[bin]]
name = "rustjoy"
path = "src/rustjoy/main.rs"

# Rust port of the PREPRO ENDF/B pre-processing codes (one executable,
# one subcommand per PREPRO program).
[[bin]]
name = "prustpro"
path = "src/prustpro/main.rs"

# Check programs for the numeric kernels (see tools/run_all.sh). They are
# not usage examples: the examples are the NJOY input decks in examples/.
[[example]]
name = "ffmt_check"
path = "tools/checks/ffmt_check.rs"

[[example]]
name = "numcheck"
path = "tools/checks/numcheck.rs"

[[example]]
name = "numcheck_broadr"
path = "tools/checks/numcheck_broadr.rs"

[dependencies]

[features]
# Test only: POWR lib=3 stores its card-5 values and lambdas where it reads
# them back, as NJOY2016 with tools/njoy-powr-cards.patch does (see README).
powr-cards = []

[profile.release]
# Keep floating-point semantics plain: no fast-math exists in Rust, and we keep
# overflow-checks off to match Fortran's wrapping integer arithmetic.
opt-level = 2
debug = 1
overflow-checks = false
